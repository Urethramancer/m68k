name: CI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: [closed]

jobs:
  run-checks:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
          - runner: macos-13
            goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      - name: Ensure modules download
        run: go mod download

      - name: Run gofmt (check)
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"; echo "$fmt_out"; exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Install golangci-lint (best-effort)
        run: |
          set -e
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(pwd)/bin v1.59.0 || true
          PATH="$(pwd)/bin:$PATH"
      - name: Run golangci-lint (may fail)
        run: |
          PATH="$(pwd)/bin:$PATH"
          golangci-lint run ./... || echo "golangci-lint failed or not compatible; continuing"

      - name: Run tests with coverage
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: List tags (debug)
        run: git tag -n1 || true
