name: CI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    types: [closed]
  workflow_dispatch: {}

jobs:
  run-checks:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25

      - name: Ensure modules download
        run: go mod download

      - name: Run gofmt (check)
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"; echo "$fmt_out"; exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Install staticcheck (best-effort)
        run: |
          set -e
          go install honnef.co/go/tools/cmd/staticcheck@latest || true
          PATH="$(go env GOPATH)/bin:$PATH"

      - name: Run staticcheck (may fail)
        run: |
          staticcheck ./... || echo "staticcheck failed or not available; continuing"

      - name: Run tests with coverage
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.run_id }}
          path: coverage.out
          overwrite: true

      - name: List tags (debug)
        run: git tag -n1 || true
