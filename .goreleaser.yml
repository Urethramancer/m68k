version: 2
project_name: m68k
before:
  hooks:
    - go mod download

builds:
  - id: asm68
    dir: .
    main: ./cmd/asm68
    binary: asm68
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.date={{.CommitDate}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64

  - id: dis68
    dir: .
    main: ./cmd/dis68
    binary: dis68
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.date={{.CommitDate}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64

archives:
  - wrap_in_directory: true
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# Homebrew (legacy brews schema)
brews:
  - name: asm68
    repository:
      owner: grimdork
      name: homebrew-tools
    commit_author:
      name: Grimdork
      email: github@grimdork.net
    homepage: "https://github.com/Urethramancer/m68k"
    description: "m68k assembler (asm68)"
    license: MIT

  - name: dis68
    repository:
      owner: grimdork
      name: homebrew-tools
    commit_author:
      name: grimdork
      email: github@grimdork.net
    homepage: "https://github.com/Urethramancer/m68k"
    description: "m68k disassembler (dis68)"
    license: MIT

# Binary signing
signs:
  - id: gpg-sign
    cmd: gpg
    args:
      - --batch
      - --pinentry-mode
      - loopback
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"
    artifacts: binary
